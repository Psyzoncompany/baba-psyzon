<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanças Pessoais • Dashboard</title>
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- PDF vetorial local: texto selecionável, sem captura da tela -->
  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../pdf-report.js"></script>
  <!-- SheetJS -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase Config -->
  <script type="module" src="../firebase-config.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="pessoal.css" />
</head>
<body>

  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div class="brand-text">
          <h1>Finanças</h1>
          <span>Pessoais</span>
        </div>
      </div>
      <button id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Fechar menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-link active" data-section="overview">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Visão Geral</span>
      </a>
      <a href="#" class="nav-link" data-section="income">
        <i class="fa-solid fa-arrow-trend-up"></i>
        <span>Receitas</span>
      </a>
      <a href="#" class="nav-link" data-section="expenses">
        <i class="fa-solid fa-arrow-trend-down"></i>
        <span>Despesas</span>
      </a>
      <a href="#" class="nav-link" data-section="bills">
        <i class="fa-solid fa-file-invoice-dollar"></i>
        <span>Contas Mensais</span>
      </a>
      <a href="#" class="nav-link" data-section="cashflow">
        <i class="fa-solid fa-money-bill-transfer"></i>
        <span>Fluxo de Caixa</span>
      </a>
      <a href="#" class="nav-link" data-section="reports">
        <i class="fa-solid fa-file-lines"></i>
        <span>Relatórios</span>
      </a>
      <a href="#" class="nav-link" data-section="settings">
        <i class="fa-solid fa-gear"></i>
        <span>Configurações</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="../index.html" class="nav-link footer-link">
        <i class="fa-solid fa-building"></i>
        <span>Dashboard Empresa</span>
      </a>
      <button id="logoutBtn" class="nav-link footer-link logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Abrir menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <a href="../index.html" class="back-btn" title="Voltar ao Dashboard Empresarial">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Empresarial</span>
        </a>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearch" placeholder="Buscar transações..." autocomplete="off" />
        </div>
      </div>
      <div class="top-bar-right">
        <button id="notificationBtn" class="icon-btn" aria-label="Notificações">
          <i class="fa-solid fa-bell"></i>
          <span id="notificationBadge" class="notification-badge hidden">0</span>
        </button>
        <div id="userAvatar" class="user-avatar" title="Perfil">
          <i class="fa-solid fa-circle-user"></i>
        </div>
      </div>
    </header>

    <!-- Notification Panel -->
    <div id="notificationPanel" class="notification-panel hidden">
      <div class="notification-panel-header">
        <h3>Notificações</h3>
        <button id="clearNotificationsBtn" class="btn-icon" title="Limpar todas"><i class="fa-solid fa-check-double"></i></button>
      </div>
      <div id="notificationList" class="notification-list">
        <div class="empty-state" style="padding:24px 0"><i class="fa-solid fa-bell-slash"></i><p>Nenhuma notificação</p></div>
      </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="main-content"></main>
  </div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalContainer" class="modal-container"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- App JS -->
  <script src="pessoal.js"></script>
  <script src="../site-preloader.js" defer></script>
</body>
</html>
